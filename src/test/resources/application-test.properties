spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.contexts=

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Sin broker en los tests de contexto: los listeners no arrancan y la aplicacion
# carga sin RabbitMQ. El test del consumidor lo activa contra Testcontainers.
app.messaging.listeners.auto-startup=false
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=test
spring.rabbitmq.password=test
app.messaging.max-retries=1
app.messaging.initial-retry-interval-ms=100

# Validacion RS256 contra una clave publica generada por TestTokenMint al arrancar
# el test (target/test-keys/). Ninguna clave se versiona y no se necesita red.
security.jwks-uri=
security.rsa.public-key-path=target/test-keys/test-public.pem
