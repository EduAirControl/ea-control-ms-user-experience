spring.application.name=ms-user-experience

# Puerto canonico segun 09-microservices/service-catalog.md
server.port=${SERVER_PORT:3006}

# ADR-003: una instancia PostgreSQL compartida y un esquema propio por servicio.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/eduaircontrol_user_experience}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.contexts=${DB_CHANGELOG_CONTEXTS:}

# Seguridad: mismo JWT que el resto de servicios; el gateway tambien lo valida.
# --- Seguridad (ADR-006): access tokens RS256 emitidos por ms-security ---
# Este servicio no emite tokens: los valida contra el JWKS de ms-security. En tests
# se usa una clave PEM fija (security.rsa.public-key-path) para no depender de red.
security.jwks-uri=${JWKS_URI:http://localhost:8081/api/v1/auth/jwks}
security.rsa.public-key-path=${JWT_PUBLIC_KEY_PATH:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

server.error.include-message=always

# --- Mensajería (ADR-007/016) ---
# Consumo de eventos de aula para la réplica ambiente->institucion. El exchange,
# la cola y el binding los declara este servicio (quien recibe lo necesita).
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
app.messaging.listeners.auto-startup=${MESSAGING_LISTENERS_AUTO_STARTUP:true}
app.messaging.max-retries=${MESSAGING_MAX_RETRIES:4}
app.messaging.initial-retry-interval-ms=${MESSAGING_INITIAL_RETRY_INTERVAL_MS:1000}
app.messaging.classroom.exchange=${CLASSROOM_EVENTS_EXCHANGE:eduaircontrol.classroom}
app.messaging.classroom.queue=${CLASSROOM_EVENTS_QUEUE:eduaircontrol.classroom.ms-user-experience}
app.messaging.classroom.routing-key=${CLASSROOM_EVENTS_ROUTING_KEY:classroom.educational_environment.*}

# --- Backfill historico ---
# Copia los datos UX del esquema `ux` del monolito al esquema propio. Es
# acoplamiento temporal: una vez copiado, la unica via son los endpoints.
app.backfill.enabled=${BACKFILL_ENABLED:false}
app.backfill.initial-run=${BACKFILL_INITIAL_RUN:false}

# ── Observabilidad ─────────────────────────────────────────────
# Prometheus (infra/observability/prometheus.yml) raspa /actuator/prometheus
# cada 15 s. Solo health y prometheus quedan expuestos: el resto de endpoints
# de actuator sigue cerrado por seguridad.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
