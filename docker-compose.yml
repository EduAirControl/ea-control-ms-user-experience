services:
  ms-user-experience:
    build: .
    container_name: ms-user-experience
    ports:
      - "${SERVER_PORT:-3006}:3006"
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-eduaircontrol_user_experience}
      POSTGRES_USER: ${POSTGRES_USER:-user_experience_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-user_experience_pass}
      # Access tokens RS256 de ms-security (ADR-006). Con compose por servicio no hay
      # ms-security en la red: se apunta al host. Sobrescriba JWKS_URI si lo hay.
      JWKS_URI: ${JWKS_URI:-http://host.docker.internal:8081/api/v1/auth/jwks}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      DB_CHANGELOG_CONTEXTS: ${DB_CHANGELOG_CONTEXTS:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3006/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: always

  postgres:
    image: postgres:15
    container_name: ms-user-experience-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduaircontrol_user_experience}
      POSTGRES_USER: ${POSTGRES_USER:-user_experience_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-user_experience_pass}
    ports:
      - "5434:5432"
    volumes:
      - ms_user_experience_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

volumes:
  ms_user_experience_data:
